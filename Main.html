<script>
  const gridColor = '#e1ddd2';
  const COLOR_SEA = '#1c5f66';
  const COLOR_SUN = '#c98a3e';
  Chart.defaults.font.family = "-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = '#12181f';

  const charts = {};
  const loadedTabs = new Set();

  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  function switchTab(tabId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelector('[data-tab="' + tabId + '"]').classList.add('active');
    loadTab(tabId);
  }

  function loadTab(tabId) {
    if (loadedTabs.has(tabId)) return;
    loadedTabs.add(tabId);

    const loaders = {
      overview: () => google.script.run.withSuccessHandler(renderOverview).withFailureHandler(onError_).getOverviewData(),
      locations: () => google.script.run.withSuccessHandler(renderLocations).withFailureHandler(onError_).getLocationData(),
      products: () => google.script.run.withSuccessHandler(renderProducts).withFailureHandler(onError_).getProductData(),
      packages: () => loadPackagesTab_(),
      behavior: () => loadBehaviorTab_(),
      quality: () => google.script.run.withSuccessHandler(renderQuality).withFailureHandler(onError_).getDataQualityData()
    };
    loaders[tabId]();
  }

  function onError_(err) {
    console.error(err);
    alert('Error loading data: ' + (err && err.message ? err.message : err));
  }

  function destroyChart_(id) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  }

  function fmtEUR_(n) {
    return '€' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  function kpi_(label, value, cls) {
    return '<div class="kpi ' + (cls || '') + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  // -------------------------------------------------------------------------
  // Overview
  // -------------------------------------------------------------------------
  function renderOverview(data) {
    document.getElementById('overviewKpis').innerHTML =
      kpi_('Redemptions', data.total_redemptions.toLocaleString('en-GB')) +
      kpi_('Net revenue', fmtEUR_(data.net_revenue)) +
      kpi_('COS %', data.cos_pct + '%') +
      kpi_('Contribution', fmtEUR_(data.contribution)) +
      kpi_('Margin %', data.margin_pct + '%') +
      kpi_('% product matched', data.match_pct + '%', data.match_pct < 100 ? 'warn' : 'ok') +
      kpi_('% price matched', data.price_match_pct + '%', data.price_match_pct < 100 ? 'warn' : 'ok');

    const top = data.top_products;
    destroyChart_('chartOverviewPareto');
    charts['chartOverviewPareto'] = new Chart(document.getElementById('chartOverviewPareto'), {
      type: 'bar',
      data: {
        labels: top.map(p => p.item_name),
        datasets: [{ label: 'Cost of sale (€)', data: top.map(p => p.cos), backgroundColor: COLOR_SEA }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false } }, y: { grid: { color: gridColor } } }
      }
    });
    // Phase 2: google.script.run.getAiCommentary('overview', data)
  }

  // -------------------------------------------------------------------------
  // Locations
  // -------------------------------------------------------------------------
  function renderLocations(data) {
    destroyChart_('chartLocationCosVolume');
    charts['chartLocationCosVolume'] = new Chart(document.getElementById('chartLocationCosVolume'), {
      type: 'bar',
      data: {
        labels: data.map(l => l.location_name),
        datasets: [
          { label: 'Cost of sale (€)', data: data.map(l => l.cos), backgroundColor: COLOR_SEA, yAxisID: 'y' },
          { label: 'Redemptions', data: data.map(l => l.count), backgroundColor: COLOR_SUN, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { position: 'left', grid: { color: gridColor }, title: { display: true, text: '€' } },
          y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'redemptions' } }
        }
      }
    });

    const byAvg = [...data].sort((a, b) => b.avg_cos_per_redemption - a.avg_cos_per_redemption);
    destroyChart_('chartLocationAvgCos');
    charts['chartLocationAvgCos'] = new Chart(document.getElementById('chartLocationAvgCos'), {
      type: 'bar',
      data: {
        labels: byAvg.map(l => l.location_name),
        datasets: [{ label: 'Avg cost of sale (€)', data: byAvg.map(l => l.avg_cos_per_redemption), backgroundColor: COLOR_SEA }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: gridColor } }, y: { grid: { display: false } } }
      }
    });

    const byContribution = [...data].sort((a, b) => b.contribution - a.contribution);
    destroyChart_('chartLocationContribution');
    charts['chartLocationContribution'] = new Chart(document.getElementById('chartLocationContribution'), {
      type: 'bar',
      data: {
        labels: byContribution.map(l => l.location_name),
        datasets: [{ label: 'Contribution (€)', data: byContribution.map(l => l.contribution), backgroundColor: COLOR_SUN }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: gridColor } }, y: { grid: { display: false } } }
      }
    });
    // Phase 2: getAiCommentary('locations', data)
  }

  // -------------------------------------------------------------------------
  // Products
  // -------------------------------------------------------------------------
  function renderProducts(data) {
    destroyChart_('chartProductPareto');
    charts['chartProductPareto'] = new Chart(document.getElementById('chartProductPareto'), {
      data: {
        labels: data.map(p => p.item_name),
        datasets: [
          { type: 'bar', label: 'Cost of sale (€)', data: data.map(p => p.cos), backgroundColor: COLOR_SEA, yAxisID: 'y' },
          { type: 'line', label: 'Cumulative %', data: data.map(p => p.cumulative_pct), borderColor: COLOR_SUN, backgroundColor: COLOR_SUN, yAxisID: 'y1', tension: 0.25, pointRadius: 3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { position: 'left', grid: { color: gridColor }, title: { display: true, text: '€' } },
          y1: { position: 'right', min: 0, max: 100, grid: { display: false }, title: { display: true, text: 'cumulative %' } }
        }
      }
    });

    const rows = data.map(p =>
      '<tr><td>' + p.item_name + '</td><td>' + p.count + '</td><td>' + fmtEUR_(p.cos) +
      '</td><td>' + fmtEUR_(p.avg_unit_cost) + '</td><td>' + fmtEUR_(p.min_unit_cost) + ' – ' + fmtEUR_(p.max_unit_cost) + '</td></tr>'
    ).join('');

    document.getElementById('productTableWrap').innerHTML =
      '<table><thead><tr><th>Product</th><th>Redemptions</th><th>Cost of sale</th><th>Avg unit cost</th><th>Cost range</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
    // Phase 2: getAiCommentary('products', data)
  }

  // -------------------------------------------------------------------------
  // Packages — three server calls, rendered together
  // -------------------------------------------------------------------------
  function loadPackagesTab_() {
    google.script.run.withSuccessHandler(renderPackageMargin).withFailureHandler(onError_).getPackageMarginData();
    google.script.run.withSuccessHandler(renderBreakage).withFailureHandler(onError_).getBreakageData();
    google.script.run.withSuccessHandler(renderBreakageTrend).withFailureHandler(onError_).getBreakageTrendData();
  }

  function renderPackageMargin(data) {
    const rows = data.map(p =>
      '<tr><td>' + p.package_name + '</td><td>' + p.redeemed + '</td><td>' + fmtEUR_(p.net_revenue) +
      '</td><td>' + fmtEUR_(p.cos) + '</td><td>' + p.cos_pct + '%</td><td>' + fmtEUR_(p.contribution) +
      '</td><td>' + p.margin_pct + '%</td></tr>'
    ).join('');

    document.getElementById('packageMarginTableWrap').innerHTML =
      '<table><thead><tr><th>Package</th><th>Redeemed</th><th>Net revenue</th><th>COS</th><th>COS %</th><th>Contribution</th><th>Margin %</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
    // Phase 2: getAiCommentary('packages-margin', data)
  }

  function renderBreakage(data) {
    const rows = data.map(p =>
      '<tr><td>' + p.package_name + '</td><td>' + p.units_sold + '</td><td>' + p.unredeemed +
      '</td><td>' + p.pct_unredeemed + '%</td><td>' + fmtEUR_(p.gross) + '</td><td>' + fmtEUR_(p.net) + '</td></tr>'
    ).join('');

    document.getElementById('breakageTableWrap').innerHTML =
      '<table><thead><tr><th>Package</th><th>Units sold</th><th>Unredeemed</th><th>% units</th><th>Gross</th><th>Net</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
    // Phase 2: getAiCommentary('packages-breakage', data)
  }

  function renderBreakageTrend(data) {
    destroyChart_('chartBreakageTrend');
    charts['chartBreakageTrend'] = new Chart(document.getElementById('chartBreakageTrend'), {
      type: 'bar',
      data: {
        labels: data.map(d => d.date),
        datasets: [{ label: '% unredeemed', data: data.map(d => d.pct_unredeemed), backgroundColor: COLOR_SUN }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { min: 0, grid: { color: gridColor }, title: { display: true, text: '%' } }, x: { grid: { display: false } } }
      }
    });
    // Phase 2: getAiCommentary('packages-trend', data)
  }

  // -------------------------------------------------------------------------
  // Behavior
  // -------------------------------------------------------------------------
  function loadBehaviorTab_() {
    google.script.run.withSuccessHandler(renderCartAbandonment).withFailureHandler(onError_).getCartAbandonmentData();
    google.script.run.withSuccessHandler(renderPurchaseWindow).withFailureHandler(onError_).getPurchaseWindowData();
    google.script.run.withSuccessHandler(renderRedemptionHour).withFailureHandler(onError_).getRedemptionHourData();
  }

  function renderCartAbandonment(data) {
    document.getElementById('behaviorKpis').innerHTML =
      kpi_('Total carts', data.total_carts.toLocaleString('en-GB')) +
      kpi_('Abandoned carts', data.abandoned_carts.toLocaleString('en-GB')) +
      kpi_('Abandonment %', data.abandonment_pct + '%', data.abandonment_pct > 15 ? 'warn' : '');
  }

  function renderPurchaseWindow(data) {
    destroyChart_('chartPurchaseWindow');
    charts['chartPurchaseWindow'] = new Chart(document.getElementById('chartPurchaseWindow'), {
      type: 'bar',
      data: {
        labels: data.map(d => d.package_name),
        datasets: [{ label: 'Avg days before event', data: data.map(d => d.avg_days_before_event), backgroundColor: COLOR_SEA }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: gridColor }, title: { display: true, text: 'days' } }, y: { grid: { display: false } } }
      }
    });
    // Phase 2: getAiCommentary('behavior-window', data)
  }

  function renderRedemptionHour(data) {
    destroyChart_('chartRedemptionHour');
    charts['chartRedemptionHour'] = new Chart(document.getElementById('chartRedemptionHour'), {
      type: 'bar',
      data: {
        labels: data.map(d => d.hour + ':00'),
        datasets: [{ label: 'Redemptions', data: data.map(d => d.count), backgroundColor: COLOR_SUN }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false } }, y: { grid: { color: gridColor } } }
      }
    });
    // Phase 2: getAiCommentary('behavior-hour', data)
  }

  // -------------------------------------------------------------------------
  // Data Quality
  // -------------------------------------------------------------------------
  function renderQuality(data) {
    const locations = data.locations;
    const sources = data.sources;
    const datasetsBySource = sources.map((src, i) => ({
      label: src,
      data: locations.map(l => (data.cost_source_by_location[l] && data.cost_source_by_location[l][src]) || 0),
      backgroundColor: i === 0 ? COLOR_SEA : COLOR_SUN
    }));

    destroyChart_('chartCostSource');
    charts['chartCostSource'] = new Chart(document.getElementById('chartCostSource'), {
      type: 'bar',
      data: { labels: locations, datasets: datasetsBySource },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: gridColor } } }
      }
    });

    renderStatusTrend_('chartMatchStatus', data.match_status_by_date, 'matched');
    renderStatusTrend_('chartPriceStatus', data.price_status_by_date, 'matched');
    renderStatusTrend_('chartPackageStatus', data.package_status_by_date, 'matched');
    // Phase 2: getAiCommentary('quality', data)
  }

  function renderStatusTrend_(canvasId, byDate, okStatus) {
    const dates = Object.keys(byDate).sort();
    const pct = dates.map(d => {
      const dayData = byDate[d];
      const total = Object.values(dayData).reduce((a, b) => a + b, 0);
      const ok = dayData[okStatus] || 0;
      return total ? Math.round((ok / total) * 100) : 0;
    });

    destroyChart_(canvasId);
    charts[canvasId] = new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels: dates, datasets: [{ label: okStatus + ' %', data: pct, backgroundColor: COLOR_SEA }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { min: 0, max: 100, grid: { color: gridColor } }, x: { grid: { display: false } } }
      }
    });
  }

  // Initial load
  loadTab('overview');
</script>
